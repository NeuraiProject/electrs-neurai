# Neurai mainnet node + electrs-neurai (ssl://, wss://).
# Settings live in .env:  cp .env.example .env  (see the comments there).

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  neuraid:
    # Official Neurai mainnet release image (v1.0.7), pinned by digest.
    # https://hub.docker.com/r/neuraiproject/neurai-node
    image: neuraiproject/neurai-node:v1.0.7@sha256:59e863a068a51ec8e88f334ef1656a5bad8030662637ff8c4c27bcbd8ff983f3
    container_name: ${COMPOSE_PROJECT_NAME:-neurai-mainnet}-node
    restart: unless-stopped
    logging: *logging

    # Keeps rpcuser/rpcpassword of neurai.conf in step with .env, then runs the
    # image's entrypoint (which writes neurai.conf only on the first start).
    entrypoint: ["/bin/sh", "/usr/local/bin/node-entrypoint.sh"]
    command: ["-printtoconsole"]

    environment:
      # NEURAI_LISTEN must be 1: electrs bulk-downloads blocks over P2P, inside
      # the stack (the P2P port is not published on the host).
      NEURAI_LISTEN: "1"
      NEURAI_P2P_PORT: "19000"
      NEURAI_REST: "1"
      NEURAI_RPC_USER: "${NEURAI_RPC_USER:-neurai}"
      NEURAI_RPC_PASSWORD: "${NEURAI_RPC_PASSWORD:?set NEURAI_RPC_PASSWORD in .env (cp .env.example .env)}"
      # electrs runs in another container: RPC listens on the container's
      # interfaces. The host only gets it on 127.0.0.1 (see ports).
      NEURAI_RPC_BIND: "0.0.0.0"
      NEURAI_RPC_ALLOW_IP: "0.0.0.0/0"
      NEURAI_RPC_PORT: "19001"
      NEURAI_RPC_WORK_QUEUE: "64"
      NEURAI_RPC_THREADS: "8"
      NEURAI_DISABLE_WALLET: "1"
      NEURAI_TXINDEX: "${NEURAI_TXINDEX:-1}"
      NEURAI_ASSETINDEX: "${NEURAI_ASSETINDEX:-1}"
      NEURAI_ADDRESSINDEX: "${NEURAI_ADDRESSINDEX:-1}"
      NEURAI_TIMESTAMPINDEX: "${NEURAI_TIMESTAMPINDEX:-1}"
      NEURAI_SPENTINDEX: "${NEURAI_SPENTINDEX:-1}"
      NEURAI_DB_CACHE: "${NEURAI_DB_CACHE:-450}"
      NEURAI_MAX_CONNECTIONS: "${NEURAI_MAX_CONNECTIONS:-125}"
      NEURAI_EXTRA_CONF: |
        rpcservertimeout=240

    volumes:
      - neurai_mainnet_data:/data
      - ../node-entrypoint.sh:/usr/local/bin/node-entrypoint.sh:ro

    # P2P and RPC for electrs, inside this stack only (not published on the
    # host): every stack on a host uses the same ports without colliding. The
    # node connects out to its peers; its RPC is reachable with
    # `docker compose exec neuraid neurai-cli -datadir=/data ...`.
    expose:
      - "19000"
      - "19001"

    networks:
      - neurai_net

    healthcheck:
      test: ["CMD", "neurai-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 60s
      # 1.0.7 can hold cs_main for ~10 s while validating KAWPOW headers.
      timeout: 30s
      retries: 5
      start_period: 120s

  electrs:
    # ── Build mode: pick one ─────────────────────────────────────────────
    # (1) LOCAL — builds the working tree at ../../ (active by default).
    build:
      context: ../..
      dockerfile: Dockerfile
    # (2) GITHUB — clones a published ref, for reproducible builds.
    #     Comment block (1) above and uncomment block (2) below to switch.
    # build:
    #   context: ./electrs
    #   dockerfile: Dockerfile
    #   args:
    #     REPO_URL: https://github.com/NeuraiProject/electrs-neurai.git
    #     REPO_REF: master
    image: neuraiproject/electrs-neurai:mainnet-1.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-neurai-mainnet}-electrs
    restart: unless-stopped
    logging: *logging

    environment:
      # The entrypoint writes them to electrs' config file (`auth`).
      DAEMON_RPC_USER: "${NEURAI_RPC_USER:-neurai}"
      DAEMON_RPC_PASSWORD: "${NEURAI_RPC_PASSWORD:?set NEURAI_RPC_PASSWORD in .env (cp .env.example .env)}"
      # Names the self-signed certificate and the reported services.
      DOMAIN: "${DOMAIN:-}"
      PUBLIC_SSL_PORT: "${ELECTRUM_SSL_PORT:-50002}"
      PUBLIC_WSS_PORT: "${ELECTRUM_WSS_PORT:-50004}"
      # Any electrs option can be set as ELECTRS_<OPTION> (empty = default).
      ELECTRS_LOG_FILTERS: "${ELECTRS_LOG_FILTERS:-INFO}"
      ELECTRS_SERVER_BANNER: "${ELECTRS_SERVER_BANNER:-}"
      ELECTRS_DONATION_ADDRESS: "${ELECTRS_DONATION_ADDRESS:-}"
      ELECTRS_REPORT_SERVICES: "${ELECTRS_REPORT_SERVICES:-}"

    volumes:
      - electrs_data:/var/lib/electrs-neurai
      # cert.pem / key.pem: self-signed on the first start, replaced by the
      # letsencrypt service when DOMAIN is set (electrs reloads them by itself).
      - electrs_tls_certs:/etc/electrs-tls

    command:
      - "--network"
      - "neurai"
      - "--db-dir"
      - "/var/lib/electrs-neurai"
      - "--daemon-rpc-addr"
      - "neuraid:19001"
      - "--daemon-p2p-addr"
      - "neuraid:19000"
      # no tcp:// (plain text): only ssl:// and wss://
      - "--disable-electrum-rpc"
      - "--electrum-ssl-addr"
      - "0.0.0.0:50002"
      - "--electrum-wss-addr"
      - "0.0.0.0:50004"
      - "--ssl-certfile"
      - "/etc/electrs-tls/cert.pem"
      - "--ssl-keyfile"
      - "/etc/electrs-tls/key.pem"

    ports:
      - "${ELECTRUM_LISTEN:+${ELECTRUM_LISTEN}:}${ELECTRUM_SSL_PORT:-50002}:50002"   # ssl://  (Electrum desktop wallets)
      - "${ELECTRUM_LISTEN:+${ELECTRUM_LISTEN}:}${ELECTRUM_WSS_PORT:-50004}:50004"   # wss://  (browser wallets, indexers)

    networks:
      - neurai_net

    depends_on:
      neuraid:
        condition: service_healthy

  letsencrypt:
    # Gets and renews a Let's Encrypt certificate for DOMAIN through the
    # Cloudflare API (DNS-01: no port needs to be open); idle when DOMAIN is
    # empty. See ../letsencrypt.sh.
    image: certbot/dns-cloudflare:v4.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-neurai-mainnet}-letsencrypt
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/letsencrypt.sh"]
    environment:
      DOMAIN: "${DOMAIN:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_PROPAGATION_SECONDS: "${CLOUDFLARE_PROPAGATION_SECONDS:-30}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL:-}"
      LETSENCRYPT_STAGING: "${LETSENCRYPT_STAGING:-0}"
    volumes:
      - ../letsencrypt.sh:/letsencrypt.sh:ro
      - letsencrypt:/etc/letsencrypt
      - electrs_tls_certs:/etc/electrs-tls

volumes:
  neurai_mainnet_data:
    driver: local
  electrs_data:
    driver: local
  electrs_tls_certs:
    driver: local
  letsencrypt:
    driver: local

networks:
  neurai_net:
    driver: bridge
