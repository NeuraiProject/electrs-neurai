services:
  neuraid:
    # Official Neurai mainnet release image (v1.0.7), pinned by digest.
    # https://hub.docker.com/r/neuraiproject/neurai-node
    # Replaces the previous local build of the `DePIN-Test` branch, which is the
    # testnet development branch and not the mainnet release.
    image: neuraiproject/neurai-node:v1.0.7@sha256:59e863a068a51ec8e88f334ef1656a5bad8030662637ff8c4c27bcbd8ff983f3
    container_name: neurai-electrs-mainnet-node
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # The image's entrypoint writes /data/neurai.conf from these variables
    # ONLY on the first start (the file is then persisted in the volume).
    # To change settings later, edit neurai.conf inside the volume and restart.
    environment:
      # ── Network ──────────────────────────────────────────────────────────
      # NEURAI_LISTEN must be 1: electrs needs P2P to bulk-download blocks from the daemon.
      NEURAI_LISTEN: "1"
      NEURAI_P2P_PORT: "19000"
      NEURAI_REST: "1"

      # ── RPC ──────────────────────────────────────────────────────────────
      NEURAI_RPC_USER: "neurai"
      NEURAI_RPC_PASSWORD: "changeme"
      # The image binds RPC to 127.0.0.1 by default; electrs runs in another
      # container, so RPC must listen on all interfaces of the container.
      NEURAI_RPC_BIND: "0.0.0.0"
      # NEURAI_RPC_ALLOW_IP: restrict in production (e.g. the neurai_net subnet)
      NEURAI_RPC_ALLOW_IP: "0.0.0.0/0"
      NEURAI_RPC_PORT: "19001"
      NEURAI_RPC_WORK_QUEUE: "64"
      NEURAI_RPC_THREADS: "8"

      # ── Wallet ───────────────────────────────────────────────────────────
      # NEURAI_DISABLE_WALLET: 1=disabled | 0=enabled
      NEURAI_DISABLE_WALLET: "1"

      # ── Indexes ──────────────────────────────────────────────────────────
      # electrs-neurai does not need any of them; kept for other consumers.
      NEURAI_TXINDEX: "1"
      NEURAI_ASSETINDEX: "1"
      NEURAI_ADDRESSINDEX: "1"
      NEURAI_TIMESTAMPINDEX: "1"
      NEURAI_SPENTINDEX: "1"

      # ── Extra neurai.conf lines (no dedicated variable in the image) ─────
      NEURAI_EXTRA_CONF: |
        rpcservertimeout=240

    volumes:
      # New volume name on purpose: data written by the old image is owned by
      # root (this image runs neuraid as the `neurai` user), its neurai.conf
      # would not be regenerated, and it was synced by the DePIN-Test branch.
      - neurai_mainnet_data:/data

    ports:
      - "19000:19000"             # mainnet P2P
      - "127.0.0.1:19001:19001"   # mainnet RPC — host loopback only

    networks:
      - neurai_net

    healthcheck:
      test: ["CMD", "neurai-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 60s
      # 1.0.7 can hold cs_main for ~10 s while validating KAWPOW headers.
      timeout: 30s
      retries: 5
      start_period: 120s

  electrs:
    # ── Build mode: pick one ─────────────────────────────────────────────
    # (1) LOCAL — copies the working tree at ../../ . Fast iteration without
    #     pushing to GitHub. Active by default.
    build:
      context: ../..
      dockerfile: Dockerfile
    # (2) GITHUB — clones a published ref. Use for reproducible builds.
    #     Comment block (1) above and uncomment block (2) below to switch.
    # build:
    #   context: ./electrs
    #   dockerfile: Dockerfile
    #   args:
    #     REPO_URL: https://github.com/NeuraiProject/electrs-neurai.git
    #     REPO_REF: master
    image: neuraiproject/electrs-neurai:mainnet-1.0.0
    container_name: neurai-mainnet-electrs
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # `auth` (RPC user:password) lives in ./electrs/config.toml because it
    # cannot be passed via CLI args or env vars. All other settings are
    # supplied via `command:` below to override the image's default CMD.
    volumes:
      - electrs_data:/var/lib/electrs-neurai
      - electrs_tls_certs:/etc/electrs-tls
      - ./electrs/config.toml:/etc/electrs/config.toml:ro

    command:
      - "--network"
      - "neurai"
      - "--db-dir"
      - "/var/lib/electrs-neurai"
      - "--daemon-rpc-addr"
      - "neuraid:19001"
      - "--daemon-p2p-addr"
      - "neuraid:19000"
      - "--electrum-rpc-addr"
      - "0.0.0.0:50001"
      # Native TLS (ssl://) and WebSocket over TLS (wss://, ElectrumX framing).
      # A self-signed certificate is created in the electrs_tls_certs volume on
      # first start; mount your own cert.pem / key.pem there to replace it.
      - "--electrum-ssl-addr"
      - "0.0.0.0:50002"
      - "--electrum-wss-addr"
      - "0.0.0.0:50004"
      - "--ssl-certfile"
      - "/etc/electrs-tls/cert.pem"
      - "--ssl-keyfile"
      - "/etc/electrs-tls/key.pem"
      - "--log-filters"
      - "INFO"

    ports:
      - "50001:50001"   # Electrum mainnet RPC
      - "50002:50002"   # ssl://  (Electrum over TLS)
      - "50004:50004"   # wss://  (Electrum over WebSocket + TLS, for browser wallets)

    networks:
      - neurai_net

    depends_on:
      neuraid:
        condition: service_healthy

volumes:
  neurai_mainnet_data:
    driver: local
  electrs_data:
    driver: local
  electrs_tls_certs:
    driver: local

networks:
  neurai_net:
    driver: bridge
